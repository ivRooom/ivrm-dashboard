# Optional drop-in for a stdlib-only Netlify/HTTP collector on existing OCI.
# Do not use for AWS/OCI SDK targets: those need the pinned venv runtime.
# Install as /etc/systemd/system/ivrm-cloud-collector.service.d/oci.conf
[Service]
ExecStart=
ExecStart=/usr/bin/python3 /opt/ivrm-cloud-collector/collector.py --config /etc/ivrm-agent/cloud-targets.json
MemoryMax=64M
CPUQuota=10%
Nice=10
TimeoutStartSec=60
