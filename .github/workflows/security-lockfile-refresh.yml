# Temporary PR-branch-only lockfile regeneration; no credentials or deployments.
name: Security Lockfile Refresh (Temporary)
on:
  push:
    branches:
      - security/nextjs-16-4-3-p0-20261029
permissions:
  contents: read
jobs:
  regenerate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - name: Regenerate lockfile without running scripts
        run: pnpm install --lockfile-only --no-frozen-lockfile --ignore-scripts
      - name: Output lockfile for reviewed GitHub commit
        run: |
          echo '===SECURITY_LOCKFILE_BEGIN==='
          cat pnpm-lock.yaml
          echo '===SECURITY_LOCKFILE_END==='
