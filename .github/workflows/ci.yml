name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: pnpmを準備
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - name: Node.jsを準備
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 依存関係をインストール
        run: pnpm install --frozen-lockfile
      - name: 型チェック
        run: pnpm typecheck
      - name: ビルド
        run: pnpm build

  agent:
    name: Agent
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Javaを準備
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: OCI更新スクリプトの構文を確認
        run: bash -n deploy/oci/update-monitoring-stack.sh
      - name: Metrics Bridgeステージスクリプトの構文を確認
        run: |
          bash -n deploy/oci/stage-minecraft-metrics-bridge.sh
          bash -n deploy/oci/test_stage_minecraft_metrics_bridge.sh
      - name: Metrics Bridge永続ステージ契約をテスト
        run: bash deploy/oci/test_stage_minecraft_metrics_bridge.sh
      - name: Metrics Bridge build/testスクリプトの構文を確認
        run: |
          bash -n apps/minecraft-metrics-bridge/build.sh
          bash -n apps/minecraft-metrics-bridge/test.sh
      - name: Minecraft Metrics Bridgeをテスト
        run: bash apps/minecraft-metrics-bridge/test.sh
      - name: Minecraft Metrics Bridgeをビルド
        run: bash apps/minecraft-metrics-bridge/build.sh /tmp/ivrm-metrics-bridge.jar
      - name: Docker Collectorの構文を確認
        run: python3 -m py_compile deploy/oci/ivrm-agent-docker-snapshot.py
      - name: Docker Collectorをテスト
        run: python3 -m unittest deploy/oci/test_ivrm_agent_docker_snapshot.py
      - name: Minecraft Performance Collectorの構文を確認
        run: python3 -m py_compile deploy/oci/ivrm-agent-minecraft-performance.py
      - name: Minecraft Performance Collectorをテスト
        run: python3 -m unittest deploy/oci/test_ivrm_agent_minecraft_performance.py
      - name: Backup Reporterの構文を確認
        run: python3 -m py_compile deploy/oci/ivrm-backup-reporter.py
      - name: Backup Reporterをテスト
        run: python3 -m unittest deploy/oci/test_ivrm_backup_reporter.py
      - name: Log Reporterの構文を確認
        run: python3 -m py_compile deploy/oci/ivrm-log-reporter.py
      - name: Log Reporterをテスト
        run: python3 -m unittest deploy/oci/test_ivrm_log_reporter.py
      - name: Goを準備
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache: false
      - name: テスト
        working-directory: apps/agent
        run: go test ./...
      - name: ビルド出力先を作成
        run: mkdir -p dist
      - name: ARM64ビルド
        working-directory: apps/agent
        run: GOOS=linux GOARCH=arm64 go build -o ../../dist/ivrm-agent-linux-arm64 ./cmd/ivrm-agent
      - name: AMD64ビルド
        working-directory: apps/agent
        run: GOOS=linux GOARCH=amd64 go build -o ../../dist/ivrm-agent-linux-amd64 ./cmd/ivrm-agent
