name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  web:
    name: Web
    runs-on: ubuntu-latest
    services:
      cloud-test-db:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: pnpmを準備
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - name: Node.jsを準備
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 依存関係をインストール
        run: pnpm install --frozen-lockfile
      - name: Operation Agent HMACと内部エラー分類をテスト
        run: node --experimental-strip-types --test tests/operation-agent-auth-core.test.mjs tests/operation-internal-error.test.mjs
      - name: 型チェック
        run: pnpm typecheck
      - name: 全システムログ収集元台帳の網羅性をテスト
        run: node --experimental-strip-types --test tests/telemetry-source-inventory.test.mjs
      - name: Cloud Monitorの認証・鮮度境界をテスト
        run: node --experimental-strip-types --test tests/cloud-monitor-core.test.mjs tests/service-catalog.test.mjs tests/runtime-inventory-core.test.mjs
      - name: Cloud Collectorをテスト
        run: python3 -m unittest discover -s apps/cloud-collector -p 'test_*.py'
      - name: Docker Runtime Inventoryの参照境界をテスト
        run: python3 -m unittest discover -s apps/runtime-collector -p 'test_*.py'
      - name: Cloud MonitorのDB・通知状態遷移をテスト
        run: >-
          psql postgresql://postgres@localhost:5432/postgres -v ON_ERROR_STOP=1
          -f tests/cloud-monitor-fixture.sql
          -f supabase/migrations/202610140001_cloud_monitoring.sql
          -f tests/cloud-monitor-db.sql
      - name: ビルド
        run: pnpm build
      - name: Runtime Inventoryのスコープ・再送・権限・保存上限をテスト
        run: >-
          createdb -h localhost -U postgres runtime_inventory_test &&
          psql postgresql://postgres@localhost:5432/runtime_inventory_test -v ON_ERROR_STOP=1
          -f tests/runtime-inventory-fixture.sql
          -f supabase/migrations/20261014165441_runtime_inventory.sql
          -f supabase/migrations/20261014172524_runtime_inventory_host_scope.sql
          -f tests/runtime-inventory-db.sql

  agent:
    name: Agent
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Javaを準備
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: PythonをOCI互換バージョンで準備
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: OCI更新スクリプトの構文を確認
        run: |
          bash -n deploy/oci/update-monitoring-stack.sh
          bash -n deploy/oci/stage-log-reporter.sh
          bash -n deploy/oci/test_stage_log_reporter.sh
          bash -n deploy/oci/stage-mc-main-lifecycle.sh
          bash -n deploy/oci/test_stage_mc_main_lifecycle.sh
      - name: Log Reporter stageの非干渉契約をテスト
        run: bash deploy/oci/test_stage_log_reporter.sh
      - name: mc-main Lifecycle stageの非干渉契約をテスト
        run: bash deploy/oci/test_stage_mc_main_lifecycle.sh
      - name: Metrics Bridgeステージスクリプトの構文を確認
        run: |
          bash -n deploy/oci/stage-minecraft-metrics-bridge.sh
          bash -n deploy/oci/test_stage_minecraft_metrics_bridge.sh
      - name: Metrics Bridge永続ステージ契約をテスト
        run: bash deploy/oci/test_stage_minecraft_metrics_bridge.sh
      - name: Metrics Bridge build/testスクリプトの構文を確認
        run: |
          bash -n apps/minecraft-metrics-bridge/build.sh
          bash -n apps/minecraft-metrics-bridge/test.sh
      - name: Minecraft Metrics Bridgeをテスト
        run: bash apps/minecraft-metrics-bridge/test.sh
      - name: Minecraft Metrics Bridgeをビルド
        run: bash apps/minecraft-metrics-bridge/build.sh /tmp/ivrm-metrics-bridge.jar
      - name: Docker Collectorの構文を確認
        run: python3 -m py_compile deploy/oci/ivrm-agent-docker-snapshot.py
      - name: Docker Collectorをテスト
        run: python3 -m unittest deploy/oci/test_ivrm_agent_docker_snapshot.py
      - name: Minecraft Performance Collectorの構文を確認
        run: python3 -m py_compile deploy/oci/ivrm-agent-minecraft-performance.py
      - name: Minecraft Performance Collectorをテスト
        run: python3 -m unittest deploy/oci/test_ivrm_agent_minecraft_performance.py
      - name: Backup Reporterの構文を確認
        run: python3 -m py_compile deploy/oci/ivrm-backup-reporter.py
      - name: Backup Reporterをテスト
        run: python3 -m unittest deploy/oci/test_ivrm_backup_reporter.py
      - name: Log Reporterの構文を確認
        run: python3 -m py_compile deploy/oci/ivrm-log-reporter.py
      - name: Log Reporterをテスト
        run: python3 -m unittest deploy/oci/test_ivrm_log_reporter.py
      - name: mc-main Lifecycle Helperの構文を確認
        run: python3 -m py_compile deploy/oci/ivrm-mc-main-lifecycle.py
      - name: mc-main Lifecycle Helperをテスト
        run: python3 -m unittest deploy/oci/test_ivrm_mc_main_lifecycle.py
      - name: Goを準備
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache: false
      - name: テスト
        working-directory: apps/agent
        run: go test ./...
      - name: ビルド出力先を作成
        run: mkdir -p dist
      - name: ARM64ビルド
        working-directory: apps/agent
        run: |
          GOOS=linux GOARCH=arm64 go build -o ../../dist/ivrm-agent-linux-arm64 ./cmd/ivrm-agent
          GOOS=linux GOARCH=arm64 go build -o ../../dist/ivrm-operation-worker-linux-arm64 ./cmd/ivrm-operation-worker
      - name: AMD64ビルド
        working-directory: apps/agent
        run: |
          GOOS=linux GOARCH=amd64 go build -o ../../dist/ivrm-agent-linux-amd64 ./cmd/ivrm-agent
          GOOS=linux GOARCH=amd64 go build -o ../../dist/ivrm-operation-worker-linux-amd64 ./cmd/ivrm-operation-worker
